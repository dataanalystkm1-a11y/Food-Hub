<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဆိုင်ပိုင်ရှင် စီမံခန့်ခွဲမှု ပန်နယ်</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pyidaungsu', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm flex justify-between items-center">
            <div>
                <h1 id="shopName" class="text-2xl font-bold text-gray-800">ဆိုင်ပိုင်ရှင် စီမံခန့်ခွဲမှု ပန်နယ်</h1>
                <p class="text-sm text-gray-500">ဆိုင်၏ မီနူးများနှင့် ဈေးနှုန်းများကို ပြင်ဆင်ရန်</p>
            </div>
            <div class="text-right">
                <span id="shopStatus" class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">Active Shop</span>
            </div>
        </div>

        <!-- Menu Management Section (မီနူးစာရင်း စီမံရန်) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm space-y-6">
            <h2 class="text-xl font-bold text-gray-800">မီနူးစာရင်း စီမံရန်</h2>
            
            <!-- မီနူးအသစ် ထည့်ရန် Form -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-4">
                <h3 class="text-sm font-semibold text-gray-700">မီနူးအသစ် ထည့်ရန်</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="newMenuName" placeholder="မီနူးအမည်" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="newMenuPrice" placeholder="ဈေးနှုန်း (ကျပ်)" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="newMenuImage" placeholder="ပုံလင့်ခ် (Image URL) - optional" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="addMenu()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg transition">မီနူးအသစ် ထည့်မည်</button>
                </div>
            </div>

            <!-- ရှိပြီးသား မီနူးစာရင်းများ -->
            <div id="menuList" class="space-y-3">
                <!-- JavaScript ဖြင့် မီနူးများ ဝင်ရောက်လာမည် -->
                <p class="text-gray-500 text-center py-4">မီနူးများကို ဆွဲထုတ်နေပါသည်...</p>
            </div>
        </div>

    </div>

    <script>
        // URL ထဲမှ shop_id ကို ယူရန် (မပါရင် 100001 ကို ယူမည်)
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shop_id') || 100001;

        async function loadShopData() {
            try {
                // ဆိုင်နာမည် ဆွဲထုတ်ရန်
                const infoRes = await fetch(`/shop-portal/info/${shopId}`);
                const infoData = await infoRes.json();
                if (infoData.success && infoData.data.shop_name) {
                    document.getElementById('shopName').innerText = infoData.data.shop_name;
                }

                // မီနူးစာရင်း ဆွဲထုတ်ရန်
                const menuRes = await fetch(`/shop-portal/menu/${shopId}`);
                const menuData = await menuRes.json();
                
                const menuListEl = document.getElementById('menuList');
                menuListEl.innerHTML = '';

                if (menuData.success && menuData.data && menuData.data.length > 0) {
                    menuData.data.forEach(menu => {
                        // ပုံရှိမရှိ စစ်ဆေးရန် (မရှိရင် default ပုံ သို့မဟုတ် placeholder ပြရန်)
                        const imageUrl = menu.image_url && menu.image_url !== "EMPTY" ? menu.image_url : "https://via.placeholder.com/60?text=No+Image";

                        menuListEl.innerHTML += `
                            <div class="flex flex-col md:flex-row justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-100 gap-3">
                                <div class="flex items-center gap-3 w-full md:w-2/5">
                                    <img src="${imageUrl}" alt="${menu.menu_name}" class="w-12 h-12 object-cover rounded-lg border border-gray-200">
                                    <div>
                                        <span class="font-semibold text-gray-800 text-lg block">${menu.menu_name}</span>
                                        <span class="text-gray-500 text-sm">${menu.price ? menu.price.toLocaleString() : 0} ကျပ်</span>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row items-center gap-2 w-full md:w-3/5 justify-end">
                                    <div class="flex flex-col gap-1 w-full md:w-auto">
                                        <input type="number" id="price_${menu.menu_id}" value="${menu.price}" placeholder="ဈေးနှုန်း" class="border border-gray-300 rounded-lg px-3 py-1 w-full md:w-28 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                                    </div>
                                    <div class="flex flex-col gap-1 w-full md:w-auto">
                                        <input type="text" id="img_${menu.menu_id}" value="${menu.image_url && menu.image_url !== 'EMPTY' ? menu.image_url : ''}" placeholder="ပုံလင့်ခ် (Image URL)" class="border border-gray-300 rounded-lg px-3 py-1 w-full md:w-48 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                                    </div>
                                    <button onclick="updateMenu(${menu.menu_id})" class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition w-full md:w-auto whitespace-nowrap">ပြင်ဆင်မည်</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    menuListEl.innerHTML = `<p class="text-gray-500 text-center py-4">ဤဆိုင်တွင် မီနူးစာရင်း မရှိသေးပါ။</p>`;
                }
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        // မီနူးအသစ် ထည့်သွင်းခြင်း
        async function addMenu() {
            const menuName = document.getElementById('newMenuName').value;
            const price = document.getElementById('newMenuPrice').value;
            const imageUrl = document.getElementById('newMenuImage').value;

            if (!menuName || !price) {
                alert("ကျေးဇူးပြု၍ မီနူးအမည်နှင့် ဈေးနှုန်း အပြည့်အစုံ ထည့်ပါ။");
                return;
            }

            try {
                const res = await fetch('/shop-portal/menu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        shop_id: parseInt(shopId),
                        menu_name: menuName,
                        price: parseFloat(price),
                        image_url: imageUrl || "EMPTY"
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('newMenuName').value = '';
                    document.getElementById('newMenuPrice').value = '';
                    document.getElementById('newMenuImage').value = '';
                    loadShopData();
                } else {
                    alert("မီနူးထည့်သွင်းမှု မအောင်မြင်ပါ။");
                }
            } catch (error) {
                console.error("Add menu error:", error);
                alert("ဆာဗာချိတ်ဆက်မှု အမှားရှိနေပါသည်။");
            }
        }

        // ဈေးနှုန်းနှင့် ပုံလင့်ခ်ကို တစ်ပါတည်း ပြင်ဆင်ခြင်း
        async function updateMenu(menuId) {
            const priceInput = document.getElementById(`price_${menuId}`);
            const imgInput = document.getElementById(`img_${menuId}`);

            if (!priceInput) {
                alert("အချက်အလက် ရှာမတွေ့ပါ။");
                return;
            }

            const newPrice = priceInput.value;
            const newImgUrl = imgInput ? imgInput.value : "";

            if (!newPrice) {
                alert("ကျေးဇူးပြု၍ ဈေးနှုန်း ထည့်ပါ။");
                return;
            }

            try {
                const res = await fetch(`/shop-portal/menu/${menuId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        price: parseFloat(newPrice),
                        image_url: newImgUrl || "EMPTY"
                    })
                });
                const data = await res.json();
                if (data.success) {
                    alert("မီနူးအချက်အလက် အောင်မြင်စွာ ပြောင်းလဲပြီးပါပြီ။");
                    loadShopData();
                } else {
                    alert("ပြောင်းလဲမှု မအောင်မြင်ပါ။");
                }
            } catch (error) {
                console.error("Update menu error:", error);
                alert("ဆာဗာချိတ်ဆက်မှု အမှားရှိနေပါသည်။");
            }
        }

        // စတင်ဖွင့်ချိန်တွင် ဒေတာခေါ်ယူရန်
        loadShopData();
    </script>
</body>
</html>
