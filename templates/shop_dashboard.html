<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဆိုင်ပိုင်ရှင် စီမံခန့်ခွဲမှု ပန်နယ်</title>
    <!-- Tailwind CSS v4 Browser Script -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pyidaungsu', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
       
        <!-- Header Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm flex justify-between items-center">
            <div>
                <h1 id="shopName" class="text-2xl font-bold text-gray-800">ဆိုင်ပိုင်ရှင် စီမံခန့်ခွဲမှု ပန်နယ်</h1>
                <p class="text-sm text-gray-500">ဆိုင်၏ မီနူးများနှင့် ဈေးနှုန်းများကို ပြင်ဆင်ရန်</p>
            </div>
            <div class="text-right">
                <span id="shopStatus" class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">Active Shop</span>
            </div>
        </div>

        <!-- Menu Management Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm space-y-6">
            <h2 class="text-xl font-bold text-gray-800">မီနူးစာရင်း စီမံရန်</h2>
           
            <!-- မီနူးအသစ် ထည့်ရန် Form -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-4">
                <h3 class="text-sm font-semibold text-gray-700">မီနူးအသစ် ထည့်ရန်</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="newMenuName" placeholder="မီနူးအမည်" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="newMenuPrice" placeholder="ဈေးနှုန်း (ကျပ်)" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="file" id="newMenuImageFile" accept="image/*" class="border border-gray-300 rounded-lg px-2 py-1.5 text-sm bg-white file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700">
                    <button id="addMenuBtn" onclick="addMenu()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg transition">မီနူးအသစ် ထည့်မည်</button>
                </div>
            </div>

            <!-- ရှိပြီးသား မီနူးစာရင်းများ -->
            <div id="menuList" class="space-y-4">
                <p class="text-gray-500 text-center py-4">မီနူးများကို ဆွဲထုတ်နေပါသည်...</p>
            </div>
        </div>

    </div>

    <!-- Menu Option ထည့်သွင်းရန် Modal -->
    <div id="optionModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800" id="modalMenuTitle">မီနူး Option ထည့်ရန်</h3>
                <button onclick="closeOptionModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <input type="hidden" id="modalMenuId">
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">အုပ်စုအမည် (ဥပမာ - အသားရွေးရန်၊ ခေါက်ဆွဲရွေးရန်)</label>
                    <input type="text" id="optionGroupName" placeholder="ဥပမာ - အသားရွေးပါ" class="border border-gray-300 rounded-lg px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ရွေးချယ်စရာ အမည် (ဥပမာ - ကြက်သား၊ အကြော်စုံ)</label>
                    <input type="text" id="optionChoiceName" placeholder="ဥပမာ - ကြက်သား" class="border border-gray-300 rounded-lg px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">အပိုကျသင့်ငွေ (မရှိလျှင် 0 ထည့်ပါ)</label>
                    <input type="number" id="optionAdditionalPrice" value="0" placeholder="0" class="border border-gray-300 rounded-lg px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- လက်ရှိ Option စာရင်းများပြရန် -->
            <div class="border-t border-gray-100 pt-3">
                <h4 class="text-xs font-semibold text-gray-600 mb-2">လက်ရှိ Option များ</h4>
                <div id="existingOptionsList" class="space-y-2 max-h-40 overflow-y-auto">
                    <p class="text-xs text-gray-400 text-center py-2">Option များ မရှိသေးပါ။</p>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeOptionModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-lg transition">ပိတ်မည်</button>
                <button onclick="saveMenuOption()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition">Option ထည့်မည်</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shop_id') || 100001;

        const SUPABASE_STORAGE_URL = 'https://xdxyjcuqtajwdiunmahy.supabase.co/storage/v1/object/public/menu-images/';

        async function loadShopData() {
            try {
                const infoRes = await fetch(`/shop-portal/info/${shopId}`);
                const infoData = await infoRes.json();
                if (infoData.success && infoData.data.shop_name) {
                    document.getElementById('shopName').innerText = infoData.data.shop_name;
                }

                const menuRes = await fetch(`/shop-portal/menu/${shopId}`);
                const menuData = await menuRes.json();
               
                const menuListEl = document.getElementById('menuList');
                menuListEl.innerHTML = '';

                if (menuData.success && menuData.data && menuData.data.length > 0) {
                    for (const menu of menuData.data) {
                        let imageUrl = "https://via.placeholder.com/60?text=No+Image";
                        if (menu.image_url && menu.image_url !== "EMPTY") {
                            imageUrl = menu.image_url.startsWith('http') ? menu.image_url : SUPABASE_STORAGE_URL + menu.image_url;
                        }

                        const statusColor = menu.status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';

                        menuListEl.innerHTML += `
                            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-3">
                                <div class="flex flex-col md:flex-row justify-between items-center gap-3">
                                    <div class="flex items-center gap-3 w-full md:w-2/5">
                                        <img src="${imageUrl}" alt="${menu.menu_name}" class="w-12 h-12 object-cover rounded-lg border border-gray-200">
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <span class="font-semibold text-gray-800 text-lg">${menu.menu_name}</span>
                                                <span class="text-xs px-2 py-0.5 rounded-full font-medium ${statusColor}">${menu.status || 'Active'}</span>
                                            </div>
                                            <span class="text-gray-500 text-sm">${menu.price ? menu.price.toLocaleString() : 0} ကျပ်</span>
                                        </div>
                                    </div>
                                    <div class="flex flex-wrap items-center gap-2 w-full md:w-3/5 justify-end">
                                        <input type="number" id="price_${menu.menu_id}" value="${menu.price}" placeholder="ဈေးနှုန်း" class="border border-gray-300 rounded-lg px-3 py-1.5 w-24 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                                        
                                        <select id="status_${menu.menu_id}" onchange="updateMenuStatus(${menu.menu_id})" class="border border-gray-300 rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="Active" ${menu.status === 'Active' ? 'selected' : ''}>ရောင်းနေသည်</option>
                                            <option value="Inactive" ${menu.status === 'Inactive' ? 'selected' : ''}>ကုန်နေသည်</option>
                                        </select>

                                        <input type="file" id="imgFile_${menu.menu_id}" accept="image/*" class="border border-gray-300 rounded-lg px-2 py-1 w-36 text-xs bg-white file:py-0.5 file:px-1 file:rounded file:border-0 file:bg-gray-100">
                                        
                                        <button onclick="openOptionModal(${menu.menu_id}, '${menu.menu_name}')" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold px-2.5 py-2 rounded-lg transition whitespace-nowrap">Option များ</button>
                                        <button onclick="updateMenu(${menu.menu_id})" class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-3 py-2 rounded-lg transition whitespace-nowrap">ပြင်မည်</button>
                                        <button onclick="deleteMenu(${menu.menu_id})" class="bg-red-500 hover:bg-red-600 text-white text-sm font-semibold px-3 py-2 rounded-lg transition whitespace-nowrap">ဖျက်မည်</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    menuListEl.innerHTML = `<p class="text-gray-500 text-center py-4">ဤဆိုင်တွင် မီနူးစာရင်း မရှိသေးပါ။</p>`;
                }
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        async function uploadImageFile(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput || fileInput.files.length === 0) return null;

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("shop_id", shopId);

            const res = await fetch('/shop-portal/upload-image', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.success) {
                return data.image_path;
            }
            throw new Error("Image upload failed");
        }

        async function addMenu() {
            const menuName = document.getElementById('newMenuName').value;
            const price = document.getElementById('newMenuPrice').value;
            const addBtn = document.getElementById('addMenuBtn');

            if (!menuName || !price) {
                alert("ကျေးဇူးပြု၍ မီနူးအမည်နှင့် ဈေးနှုန်း အပြည့်အစုံ ထည့်ပါ။");
                return;
            }

            try {
                addBtn.disabled = true;
                addBtn.innerText = "ပုံတင်နေသည် & သိမ်းနေသည်...";

                let imagePath = "EMPTY";
                const fileInput = document.getElementById('newMenuImageFile');
                if (fileInput.files.length > 0) {
                    imagePath = await uploadImageFile('newMenuImageFile');
                }

                const res = await fetch('/shop-portal/menu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        shop_id: parseInt(shopId),
                        menu_name: menuName,
                        price: parseFloat(price),
                        image_url: imagePath,
                        status: "Active"
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('newMenuName').value = '';
                    document.getElementById('newMenuPrice').value = '';
                    fileInput.value = '';
                    alert(`"${menuName}" မီနူးအသစ်ကို အောင်မြင်စွာ ထည့်သွင်းပြီးပါပြီရှင်! ✨`);
                    loadShopData();
                } else {
                    alert("မီနူးထည့်သွင်းမှု မအောင်မြင်ပါ။");
                }
            } catch (error) {
                console.error("Add menu error:", error);
                alert("ပုံတင်ခြင်း သို့မဟုတ် ဆာဗာချိတ်ဆက်မှု အမှားရှိနေပါသည်။");
            } finally {
                addBtn.disabled = false;
                addBtn.innerText = "မီနူးအသစ် ထည့်မည်";
            }
        }

        async function updateMenuStatus(menuId) {
            const statusSelect = document.getElementById(`status_${menuId}`);
            const newStatus = statusSelect.value;

            try {
                const res = await fetch(`/shop-portal/menu/status/${menuId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (!data.success) {
                    alert("Status ပြောင်းလဲမှု မအောင်မြင်ပါ။");
                }
            } catch (error) {
                console.error("Update status error:", error);
                alert("ဆာဗာချိတ်ဆက်မှု အမှားရှိနေပါသည်။");
            }
        }

        async function updateMenu(menuId) {
            const priceInput = document.getElementById(`price_${menuId}`);
            if (!priceInput) return;

            const newPrice = priceInput.value;
            if (!newPrice) {
                alert("ကျေးဇူးပြု၍ ဈေးနှုန်း ထည့်ပါ။");
                return;
            }

            try {
                let updatePayload = { price: parseFloat(newPrice) };
                const fileInput = document.getElementById(`imgFile_${menuId}`);
               
                if (fileInput && fileInput.files.length > 0) {
                    const newImgPath = await uploadImageFile(`imgFile_${menuId}`);
                    if (newImgPath) {
                        updatePayload.image_url = newImgPath;
                    }
                }

                const res = await fetch(`/shop-portal/menu/${menuId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatePayload)
                });
                const data = await res.json();
                if (data.success) {
                    alert("မီနူးအချက်အလက် အောင်မြင်စွာ ပြောင်းလဲပြီးပါပြီ။");
                    loadShopData();
                } else {
                    alert("ပြောင်းလဲမှု မအောင်မြင်ပါ။");
                }
            } catch (error) {
                console.error("Update menu error:", error);
                alert("ဆာဗာချိတ်ဆက်မှု အမှားရှိနေပါသည်။");
            }
        }

        async function deleteMenu(menuId) {
            if (!confirm("ဤမီနူးကို အမှန်တကယ် ဖျက်မှာ သေချာပါသလား?")) return;

            try {
                const res = await fetch(`/shop-portal/menu/${menuId}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (data.success) {
                    alert("မီနူးကို အောင်မြင်စွာ ဖျက်ပြီးပါပြီ။");
                    loadShopData();
                } else {
                    alert("မီနူးဖျက်ခြင်း မအောင်မြင်ပါ။");
                }
            } catch (error) {
                console.error("Delete menu error:", error);
                alert("ဆာဗာချိတ်ဆက်မှု အမှားရှိနေပါသည်။");
            }
        }

        // --- Menu Options စီမံခန့်ခွဲမှုဆိုင်ရာ JavaScript များ ---
        async function openOptionModal(menuId, menuName) {
            document.getElementById('modalMenuId').value = menuId;
            document.getElementById('modalMenuTitle').innerText = `${menuName} - Option များ`;
            document.getElementById('optionGroupName').value = '';
            document.getElementById('optionChoiceName').value = '';
            document.getElementById('optionAdditionalPrice').value = '0';
            
            await loadExistingOptions(menuId);
            document.getElementById('optionModal').classList.remove('hidden');
        }

        function closeOptionModal() {
            document.getElementById('optionModal').classList.add('hidden');
        }

        async function loadExistingOptions(menuId) {
            const listEl = document.getElementById('existingOptionsList');
            listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">ဆွဲထုတ်နေပါသည်...</p>`;
            
            try {
                const res = await fetch(`/shop-portal/menu-options/${menuId}`);
                const data = await res.json();

                if (data.success && data.data && data.data.length > 0) {
                    listEl.innerHTML = '';
                    data.data.forEach(opt => {
                        listEl.innerHTML += `
                            <div class="flex justify-between items-center bg-gray-50 px-3 py-2 rounded-lg border border-gray-200 text-xs">
                                <div>
                                    <span class="font-semibold text-gray-700">[${opt.group_name}]</span>
                                    <span class="text-gray-600">${opt.choice_name}</span>
                                    <span class="text-green-600 font-medium">(+${opt.additional_price} ကျပ်)</span>
                                </div>
                                <button onclick="deleteMenuOption(${opt.option_id}, ${menuId})" class="text-red-500 hover:text-red-700 font-bold px-1.5 py-0.5">ဖျက်ရန်</button>
                            </div>
                        `;
                    });
                } else {
                    listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">Option များ မရှိသေးပါ။</p>`;
                }
            } catch (err) {
                console.error("Load options error:", err);
                listEl.innerHTML = `<p class="text-xs text-red-400 text-center py-2">Option များ ဆွဲထုတ်၍ မရပါ။</p>`;
            }
        }

        async function saveMenuOption() {
            const menuId = document.getElementById('modalMenuId').value;
            const groupName = document.getElementById('optionGroupName').value;
            const choiceName = document.getElementById('optionChoiceName').value;
            const additionalPrice = document.getElementById('optionAdditionalPrice').value;

            if (!groupName || !choiceName) {
                alert("အုပ်စုအမည်နှင့် ရွေးချယ်စရာ အမည်ကို ဖြည့်ပါ။");
                return;
            }

            try {
                const res = await fetch('/shop-portal/menu-options', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        menu_id: parseInt(menuId),
                        group_name: groupName,
                        choice_name: choiceName,
                        additional_price: parseFloat(additionalPrice || 0)
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('optionGroupName').value = '';
                    document.getElementById('optionChoiceName').value = '';
                    document.getElementById('optionAdditionalPrice').value = '0';
                    await loadExistingOptions(menuId);
                } else {
                    alert("Option ထည့်သွင်းမှု မအောင်မြင်ပါ။");
                }
            } catch (err) {
                console.error("Save option error:", err);
                alert("ဆာဗာချိတ်ဆက်မှု အမှားရှိနေပါသည်။");
            }
        }

        async function deleteMenuOption(optionId, menuId) {
            if (!confirm("ဤ Option ကို ဖျက်မှာ သေချာပါသလား?")) return;

            try {
                const res = await fetch(`/shop-portal/menu-options/${optionId}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (data.success) {
                    await loadExistingOptions(menuId);
                } else {
                    alert("ဖျက်ဆီးမှု မအောင်မြင်ပါ။");
                }
            } catch (err) {
                console.error("Delete option error:", err);
                alert("ဆာဗာချိတ်ဆက်မှု အမှားရှိနေပါသည်။");
            }
        }

        loadShopData();
    </script>
</body>
</html>
