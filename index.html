<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nway's Delivery App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-over { border: 4px solid #db2777 !important; background-color: #fce7f3 !important; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- ခြင်းဧရိယာ -->
    <header id="cartArea" class="bg-pink-600 text-white p-8 shadow-2xl sticky top-0 z-50 text-center transition-all duration-300 border-b-8 border-pink-700">
        <h1 class="text-3xl font-bold">🛒 ခြင်းထဲသို့ ဆွဲထည့်ပါ (သို့) နှိပ်ပါ</h1>
        <p class="text-lg mt-2 font-medium">ရွေးချယ်ထားပြီး: <span id="cartCount" class="font-bold underline text-2xl">0</span> ခု</p>
    </header>

    <main class="p-6">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">🔥 လူကြိုက်များသော မီနူးများ</h2>
        <div id="menuContainer" class="flex gap-6 overflow-x-auto pb-6">
            <!-- JavaScript မှ မီနူးများ ဒီနေရာတွင် ပေါ်လာပါမည် -->
        </div>
    </main>

    <script>
        const API_BASE_URL = 'https://mgyfoodie.onrender.com';
        let cart = [];

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
        }

        async function loadData() {
            const res = await fetch(`${API_BASE_URL}/menus`);
            const menus = await res.json();
            const container = document.getElementById('menuContainer');

            container.innerHTML = menus.map((item, index) => `
                <div draggable="true" 
                     ondragstart="drag(event, ${index})" 
                     class="min-w-[300px] bg-white p-5 rounded-3xl shadow-xl border-2 hover:border-pink-300 transition-all">
                    <img src="${item.image_url}" class="w-full h-56 object-cover rounded-2xl mb-4">
                    <h3 class="text-2xl font-bold text-gray-800">${item.menu_name}</h3>
                    <p class="text-pink-600 font-bold text-xl mb-4">${item.price} ကျပ်</p>
                    
                    <!-- နှိပ်၍လည်းထည့်နိုင်သော ခလုတ် -->
                    <button onclick="addToCartFromButton(${index})" 
                            class="w-full bg-pink-600 text-white text-lg font-bold py-4 rounded-2xl hover:bg-pink-700 active:scale-95 transition-all shadow-lg">
                        ✅ ထည့်မည်
                    </button>
                </div>
            `).join('');

            window.allMenus = menus;
        }

        // Drag လုပ်ရန်
        function drag(ev, index) {
            ev.dataTransfer.setData("itemIndex", index);
        }

        // Button နှိပ်၍ထည့်ရန်
        function addToCartFromButton(index) {
            const item = window.allMenus[index];
            cart.push(item);
            updateCartUI();
            alert(item.menu_name + " ကို ခြင်းထဲ ထည့်လိုက်ပါပြီရှင်!");
        }

        // Drop လုပ်ရန်
        const cartArea = document.getElementById('cartArea');
        cartArea.addEventListener('dragover', (ev) => {
            ev.preventDefault();
            cartArea.classList.add('drag-over');
        });
        cartArea.addEventListener('dragleave', () => cartArea.classList.remove('drag-over'));
        cartArea.addEventListener('drop', (ev) => {
            ev.preventDefault();
            cartArea.classList.remove('drag-over');
            const index = ev.dataTransfer.getData("itemIndex");
            const item = window.allMenus[index];
            cart.push(item);
            updateCartUI();
            alert(item.menu_name + " ခြင်းထဲရောက်သွားပါပြီရှင်!");
        });

        loadData();
    </script>
</body>
</html>
