<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food & Delivery Service</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes cartBounce { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }
        .animate-bounce-cart { animation: cartBounce 0.3s ease-in-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-toast { animation: fadeInUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-24">

    <!-- Header -->
    <div class="bg-red-500 text-white p-4 sticky top-0 z-40 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold">🍔 Delivery App</h1>
        <button id="cart-btn" onclick="toggleCartModal()" class="relative bg-white text-red-500 px-3 py-1.5 rounded-full font-bold text-sm shadow">
            <i class="fa-solid fa-cart-shopping"></i> စျေးဝယ်ခြင်း
            <span id="cart-badge" class="hidden absolute -top-2 -right-2 bg-yellow-400 text-red-900 text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
        </button>
    </div>

    <!-- Toast Notification -->
    <div id="toast-notification" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg z-50 hidden flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-green-400 text-sm"></i>
        <span id="toast-message">စျေးဝယ်ခြင်းထဲ ထည့်ပြီးပါပြီ</span>
    </div>

    <div class="p-4 space-y-5 max-w-md mx-auto">
        <div id="main-sections" class="space-y-6">
            <div>
                <h2 class="text-base font-bold text-gray-800 mb-2">🔥 လူကြိုက်များသော မီနူးများ</h2>
                <div id="featured-menus" class="flex space-x-3 overflow-x-auto no-scrollbar py-1"></div>
            </div>
            <div>
                <h2 class="text-base font-bold text-gray-800 mb-2">🏪 ဆိုင်များ</h2>
                <div id="shops-list" class="flex space-x-3 overflow-x-auto no-scrollbar py-1"></div>
            </div>
        </div>
        <div>
            <h2 class="text-base font-bold text-gray-800 mb-2">🍽️ မီနူးအားလုံး</h2>
            <div id="all-menus-grid" class="grid grid-cols-2 gap-3"></div>
        </div>
    </div>

    <!-- Shop Menu Modal -->
    <div id="shop-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-end">
        <div class="bg-white w-full max-h-[80vh] rounded-t-2xl p-4 overflow-y-auto max-w-md mx-auto">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
                <h3 id="modal-shop-title" class="font-bold text-lg text-gray-800"></h3>
                <button onclick="closeShopModal()" class="text-gray-500 text-xl font-bold">&times;</button>
            </div>
            <div id="modal-shop-menus" class="grid grid-cols-2 gap-3"></div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-end">
        <div class="bg-white w-full max-h-[90vh] rounded-t-2xl p-4 overflow-y-auto max-w-md mx-auto space-y-4">
            <h3 class="font-bold text-lg border-b pb-2">🛒 အော်ဒါတင်ရန်</h3>
            <div id="cart-items-container" class="space-y-2 max-h-40 overflow-y-auto"></div>
            <input type="text" id="cust-name" placeholder="အမည်" class="w-full text-sm p-2 border rounded-lg">
            <input type="tel" id="cust-phone" placeholder="ဖုန်းနံပါတ်" class="w-full text-sm p-2 border rounded-lg">
            <textarea id="cust-address" placeholder="လိပ်စာ" class="w-full text-sm p-2 border rounded-lg"></textarea>
            <select id="deli-select" class="w-full text-sm p-2 border rounded-lg"></select>
            <select id="payment-method" class="w-full text-sm p-2 border rounded-lg">
                <option value="KPay">📱 KBZ Pay (Screenshot တင်မည်)</option>
                <option value="Cash on Delivery (COD)">💵 Cash on Delivery</option>
            </select>
            <button onclick="handleCheckout()" class="w-full bg-red-500 text-white font-bold py-3 rounded-lg">အော်ဒါ ဆက်သွားမည်</button>
        </div>
    </div>

    <!-- KPay Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 text-center">
            <h3 class="font-bold text-base border-b pb-2">📱 KPay ငွေလွှဲ & Screenshot</h3>
            <p class="text-xs text-gray-500">ကျေးဇူးပြု၍ QR ကို Save ပြီး ငွေလွှဲပါ။ ထို့နောက် ငွေလွှဲ Screenshot ပုံ တင်ပေးပါ။</p>
            <p id="pay-modal-amount" class="text-xl font-extrabold text-red-600">0 ကျပ်</p>
            <div id="pay-qr-container"></div>
            <div class="text-left text-xs bg-gray-50 p-2 rounded">
                <p>KPay ဖုန်း: <span id="pay-acc-number" class="font-bold text-blue-600"></span></p>
            </div>
            <div class="text-left">
                <label class="block text-xs font-bold text-gray-700">Screenshot ပုံ တင်ရန်</label>
                <input type="file" id="pay-screenshot-file" accept="image/*" class="w-full text-xs p-2 border rounded-lg">
            </div>
            <button onclick="confirmOrderAfterPayment()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl">ငွေလွှဲပြီးပါပြီ - အော်ဒါတင်မည်</button>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_ID = "1LAB2BT7-jg9XqCsmJHddgQ4STSkwn6FeBttL03-59ss";
        const GOOGLE_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyuZmV-CON7myJG9N3obFP3oA7nrSlquBjA6ANJ3IuoNtVQCIE1Q6uA2US82nUq6-Lz/exec";
        const TELEGRAM_BOT_TOKEN = "8453664740:AAGiLC4MPpz7Ce_B2-UuZWHyK2TKA35Mj0Q";
        const DEFAULT_CHAT_ID = "5921089974";
        
        let menuData = [], deliData = [], cart = [], pendingOrderData = null;

        async function loadSheetData() {
            const menuRes = await fetch(`https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Menu`);
            menuData = parseCSV(await menuRes.text());
            const deliRes = await fetch(`https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Deli`);
            deliData = parseCSV(await deliRes.text());
            renderAppUI();
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
            return lines.slice(1).filter(l => l.trim()).map(line => {
                const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                let obj = {};
                headers.forEach((h, i) => obj[h] = values[i] ? values[i].replace(/"/g, '').trim() : '');
                return obj;
            });
        }

        function renderAppUI() {
            // Render logic here (similar to previous)
            const grid = document.getElementById('all-menus-grid');
            menuData.forEach(item => {
                grid.innerHTML += `<div class="bg-white rounded-xl shadow p-2"><h4 class="text-xs font-bold">${item.menu_name}</h4><button onclick="addToCart('${item.menu_name}', '${item.shop_name}', ${item.price}, '${item.chat_id}')" class="bg-red-500 text-white text-xs w-full py-1 mt-2 rounded">+ ထည့်မည်</button></div>`;
            });
            const deliSelect = document.getElementById('deli-select');
            deliData.forEach(d => deliSelect.innerHTML += `<option value="${d.deli_name}" data-price="${d.price}" data-chatid="${d.chat_id}">${d.deli_name}</option>`);
        }

        function addToCart(name, shop, price, chatId) {
            cart.push({ name, shop, price: parseInt(price), qty: 1, chatId });
            document.getElementById('cart-badge').innerText = cart.length;
            document.getElementById('cart-badge').classList.remove('hidden');
        }

        function toggleCartModal() { document.getElementById('cart-modal').classList.toggle('hidden'); }

        function handleCheckout() {
            const name = document.getElementById('cust-name').value;
            if(!name) return alert("အချက်အလက်ဖြည့်ပါ။");
            pendingOrderData = { name, cartItems: [...cart], subtotal: cart.reduce((s,i) => s + i.price, 0) };
            if (document.getElementById('payment-method').value === "KPay") {
                document.getElementById('pay-modal-amount').innerText = pendingOrderData.subtotal + " ကျပ်";
                document.getElementById('payment-modal').classList.remove('hidden');
            } else { executeSubmitOrder(); }
        }

        async function confirmOrderAfterPayment() {
            const fileInput = document.getElementById('pay-screenshot-file');
            if (fileInput.files.length === 0) return alert("ကျေးဇူးပြု၍ Screenshot ပုံ တင်ပေးပါ။");
            const base64 = await toBase64(fileInput.files[0]);
            document.getElementById('payment-modal').classList.add('hidden');
            executeSubmitOrder(true, base64);
        }

        const toBase64 = file => new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
        });

        async function executeSubmitOrder(isKPay = false, base64 = null) {
            const data = pendingOrderData;
            let text = `📦 အော်ဒါအသစ်\n👤 ${data.name}\n💰 ${data.subtotal} ကျပ်`;
            const shopChatId = data.cartItems[0].chatId || DEFAULT_CHAT_ID;
            
            if (isKPay && base64) {
                await sendTelegramPhoto(base64, text, shopChatId);
            } else {
                await sendTelegram(text, shopChatId);
            }
            alert("အော်ဒါတင်ခြင်း အောင်မြင်ပါသည်။");
            cart = []; toggleCartModal();
        }

        async function sendTelegram(text, chatId) {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({chat_id: chatId, text}) });
        }

        async function sendTelegramPhoto(base64, caption, chatId) {
            const arr = base64.split(','), mime = arr[0].match(/:(.*?);/)[1], bstr = atob(arr[1]), u8arr = new Uint8Array(bstr.length);
            for(let i=0; i<bstr.length; i++) u8arr[i] = bstr.charCodeAt(i);
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', new Blob([u8arr], {type: mime}));
            formData.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        }

        window.onload = loadSheetData;
    </script>
</body>
</html>
