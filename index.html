<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-12">
    <!-- Header -->
    <header class="bg-rose-500 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">🍔 Delivery App</h1>
        <button class="bg-white text-rose-500 px-4 py-2 rounded-full font-semibold shadow">🛒 ဈေးဝယ်ခြင်း</button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- Popular Foods -->
        <section>
            <h2 class="text-lg font-bold mb-3">🔥 လူကြိုက်များသော မုန့်များ</h2>
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white p-2 rounded-xl shadow">
                    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" class="w-full h-24 object-cover rounded-lg">
                    <h3 class="font-bold text-sm mt-1">ထမင်းသုပ်</h3>
                    <p class="text-xs text-gray-500">မြန်မာမုန့်</p>
                    <p class="text-rose-500 font-bold text-sm mt-1">3,500 ကျပ်</p>
                    <button class="w-full bg-rose-500 text-white text-xs py-1 rounded mt-2">+ ထည့်မည်</button>
                </div>
                <div class="bg-white p-2 rounded-xl shadow">
                    <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd" class="w-full h-24 object-cover rounded-lg">
                    <h3 class="font-bold text-sm mt-1">ခေါက်ဆွဲသုပ်</h3>
                    <p class="text-xs text-gray-500">မြန်မာမုန့်</p>
                    <p class="text-rose-500 font-bold text-sm mt-1">2,000 ကျပ်</p>
                    <button class="w-full bg-rose-500 text-white text-xs py-1 rounded mt-2">+ ထည့်မည်</button>
                </div>
                <div class="bg-white p-2 rounded-xl shadow">
                    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38" class="w-full h-24 object-cover rounded-lg">
                    <h3 class="font-bold text-sm mt-1">အကြော်စုံ</h3>
                    <p class="text-xs text-gray-500">အဆာပြေ</p>
                    <p class="text-rose-500 font-bold text-sm mt-1">1,500 ကျပ်</p>
                    <button class="w-full bg-rose-500 text-white text-xs py-1 rounded mt-2">+ ထည့်မည်</button>
                </div>
            </div>
        </section>

        <!-- Shops -->
        <section>
            <h2 class="text-lg font-bold mb-3">🏪 ဆိုင်များ</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-3 rounded-xl shadow text-center">
                    <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5" class="w-16 h-16 object-cover rounded-full mx-auto">
                    <h3 class="font-bold text-sm mt-2">မိန်မိန်</h3>
                    <button class="text-rose-500 text-xs border border-rose-500 px-3 py-1 rounded-full mt-2">ကြည့်ရန်</button>
                </div>
                <div class="bg-white p-3 rounded-xl shadow text-center">
                    <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4" class="w-16 h-16 object-cover rounded-full mx-auto">
                    <h3 class="font-bold text-sm mt-2">ရွှေနဒီ Restaurent</h3>
                    <button class="text-rose-500 text-xs border border-rose-500 px-3 py-1 rounded-full mt-2">ကြည့်ရန်</button>
                </div>
            </div>
        </section>

        <!-- All Foods -->
        <section>
            <h2 class="text-lg font-bold mb-3">🍽️ မုန့်အားလုံး</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-2 rounded-xl shadow">
                    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" class="w-full h-28 object-cover rounded-lg">
                    <h3 class="font-bold text-sm mt-1">လက်ဖက်ထမင်း</h3>
                    <p class="text-xs text-gray-500">မြန်မာစာ</p>
                </div>
                <div class="bg-white p-2 rounded-xl shadow">
                    <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd" class="w-full h-28 object-cover rounded-lg">
                    <h3 class="font-bold text-sm mt-1">ထမင်းသုပ်</h3>
                    <p class="text-xs text-gray-500">မြန်မာစာ</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
