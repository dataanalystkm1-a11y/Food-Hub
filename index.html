<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nway's Foodie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Horizontal Scroll Styling */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .menu-card { 
            cursor: grab; 
            transition: all 0.2s; 
            touch-action: manipulation;
        }
        /* Vibration / Active Effect */
        .menu-card:active { 
            transform: scale(0.95); 
            background-color: #fce7f3; /* Pink-100 */
        }
    </style>
</head>
<body class="bg-gray-100 pb-12">

        <button id="cartBtn" class="bg-white text-pink-600 px-4 py-2 rounded-full font-semibold text-sm">🛒 (<span id="cartCount">0</span>)</button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- Menus Section (Horizontal Scroll) -->
        <section>
            <h2 class="text-lg font-bold mb-3 text-gray-800">🔥 မီနူးများ</h2>
            <div id="menuContainer" class="flex overflow-x-auto gap-4 pb-4 no-scrollbar">
                <p class="text-gray-500">Loading...</p>
            </div>
        </section>

        <!-- Shops Section (Grid 2x2) -->
        <section>
            <h2 class="text-lg font-bold mb-3 text-gray-800">🏪 ဆိုင်များ</h2>
            <div id="shopContainer" class="grid grid-cols-2 gap-4">
                <p class="text-gray-500">Loading...</p>
            </div>
        </section>

        <!-- Deli Services Hidden -->
        <section class="hidden">
            <div id="deliContainer"></div>
        </section>
    </main>

    <!-- Shop Detail Modal (Grid 2x2 for Items) -->
    <div id="shopModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl max-h-[80vh] overflow-y-auto">
            <h2 id="shopModalTitle" class="text-lg font-bold mb-4 text-gray-800"></h2>
            <div id="shopMenuList" class="grid grid-cols-2 gap-4"></div>
            <button onclick="document.getElementById('shopModal').classList.add('hidden')" class="w-full mt-6 bg-gray-200 py-2 rounded-xl text-sm">ပိတ်ရန်</button>
        </div>
    </div>

</html>
